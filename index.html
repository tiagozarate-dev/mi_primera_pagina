<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi presentacion</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="encabezado">
        <div class="logo">
            <span>SOZ</span>
        </div>
        <nav class="nav-links">
        <a href="#info">Sobre mi</a>
        <a href="#numeroFavorito">NumeroFavorito</a>
        <a href="#gustos">Gustos</a>
    </nav> </header>
    <h1> Santiago Ortiz Zarate</h1>
    <hr>
    <section id="info">
        <h2>Descripción:</h2> 
        <p>Mi nombre es santiago ortiz y tengo 22 años, me gusta la programación y el ingles, simpre estoy dispuesto a aprender cosas nuevas y a experiencias que me hagan sentir vivo.</p>
    </section>
    <section id="numeroFavorito">
        <label for="numero">Adivina mi número favorito: </label>
        <input type="number" id="numero" min="0" max="100" placeholder="Adivina el número del 1 al 100" oninput="if(this.value > 100) this.value = 100; if(this.value < 0) this.value = 0;">
        <p id="resultado"></p>
    </section>
    <section id="gustos">
        <label for="eleccion">Mis tres pasiones</label>
        <select name="gustos" id="eleccion">
            <option value="">Mis tres gustos</option>
            <option value="futbol">Mi mayor gusto el futbol </option>
            <option value="lugar">Mi lugar favotito </option>
            <option value="accionFav">Lo que más hago</option>
        </select>

    </section>
    <p id="pasiones"></p>
    <img src="img/images.jpg" width="400" alt="cantante" id="imagen">
    <br>
    <button id="boton">Boton</button>
    <script src="js/app.js"></script>
</body>
</html>
